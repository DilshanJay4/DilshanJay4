name: GitHub Metrics

on:
  # Schedule updates everyday at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Run automatically when you push updates to main
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Live Metrics Dashboard
        uses: lowlighter/metrics@latest
        with:
          # GitHub Personal Access Token with repo & read:user scopes (falls back to default GITHUB_TOKEN)
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          # Your GitHub username
          user: DilshanJay4

          # Output file name in repository root
          filename: github-metrics.svg

          # Timezone matching your profile
          config_timezone: Asia/Colombo
          config_padding: 0, 8

          # Base Metrics: Commits, PRs, Issues, Stars & Octocat ring
          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # ---------------------------------------------------------
          # 1. MOST USED LANGUAGES
          # ---------------------------------------------------------
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_ignored: html, css

          # ---------------------------------------------------------
          # 2. NOTABLE CONTRIBUTIONS
          # ---------------------------------------------------------
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request, issue
          plugin_notable_indepth: yes

